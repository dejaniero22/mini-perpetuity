name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Docker Official Image `postgres:18`, digest read from the Docker Hub registry 2026-11-10 (MB2)
        image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MP_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Hook tests
        run: bash tests/hooks/test_protect_paths.sh
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Confirm database is PostgreSQL 18
        run: psql "$MP_ADMIN_DSN" -tAc "SELECT version()" | grep -q "^PostgreSQL 18"
      # M7 (backups): pg_dump must be the server's major version or newer, and the runner image
      # removes the PostgreSQL apt repo after building. So add the official PGDG repo (key from
      # postgresql.org, pinned to this repo by signed-by) and install the v18 client tools, plus
      # the standard `age` tool that the tests use to check our files open with the reference tool.
      - name: Install PostgreSQL 18 client tools and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 age
          echo "MP_PG_BIN_DIR=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - run: uv run pytest -q
      - run: uv run pip-audit
